services:
  db:
    image: postgres:15-alpine
    container_name: chat_db
    environment:
      - POSTGRES_DB=necromancer
      - POSTGRES_USER=necromancer
      - POSTGRES_PASSWORD=necromancer_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  daemonium:
    build:
      context: ./daemonium
    container_name: chat_daemonium
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=necromancer
      - DB_USER=necromancer
      - DB_PASS=necromancer_secret
    volumes:
      - ./tabularium:/app/tabularium
    depends_on:
      - db
    restart: always

  interpres:
    build:
      context: ./interpres
    container_name: chat_interpres
    ports:
      - "666:8000"
    env_file:
      - ./.env
      - ./config.env
    environment:
      - DAEMONIUM_HOST=daemonium
      - AEQUILIBRIUM_HOST=aequilibrium
      - MECHANICA_HOST=mechanica
      - MECHANICA_PORT=8082
    volumes:
      - ./interpres:/app/interpres
    depends_on:
      - daemonium
      - aequilibrium
      - mechanica
    restart: always

  aequilibrium:
    build:
      context: ./aequilibrium
    container_name: chat_aequilibrium
    ports:
      - "8081:8081"
    volumes:
      - ./tabularium:/app/tabularium
    restart: always

  mechanica:
    build:
      context: ./mechanica
    container_name: chat_mechanica
    ports:
      - "8082:8082"
    restart: always

volumes:
  pgdata:
