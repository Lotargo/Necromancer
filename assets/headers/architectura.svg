<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="100%" height="50">
  <defs>
    <!-- Import Google Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');

      .bg {
        fill: #030804;
        stroke: #00ff66;
        stroke-width: 1.5;
        stroke-opacity: 0.8;
      }

      .text {
        font-family: 'VT323', monospace;
        font-size: 24px;
        fill: #00ff66;
        text-anchor: middle;
        letter-spacing: 2px;
        filter: url(#glow);
      }

      .line {
        stroke: #00ff66;
        stroke-width: 1;
        stroke-opacity: 0.2;
      }

      .crt-lines {
        fill: url(#crt-pattern);
        opacity: 0.12;
      }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CRT scanlines pattern -->
    <pattern id="crt-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Status Bar Box -->
  <rect class="bg" x="1" y="1" width="798" height="48" rx="5" />
  
  <!-- Sub-decor line -->
  <line class="line" x1="10" y1="38" x2="790" y2="38" />

  <!-- Neon-Green Monospace Title -->
  <text x="400" y="31" class="text">ARCHITECTURA SYSTEMATIS (SYSTEM ARCHITECTURE)</text>

  <!-- Interactive visual indicator like terminal corner brackets -->
  <path d="M 12,12 L 12,8 L 18,8" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 788,12 L 788,8 L 782,8" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 12,38 L 12,42 L 18,42" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 788,38 L 788,42 L 782,42" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- CRT overlay scanlines -->
  <rect class="crt-lines" width="100%" height="100%" rx="5" pointer-events="none" />
</svg>