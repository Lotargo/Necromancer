<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 110" width="100%" height="110">
  <defs>
    <!-- Import Google Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&amp;display=swap');

      .bg {
        fill: #030804;
        stroke: #00ff66;
        stroke-width: 1;
        stroke-opacity: 0.3;
      }

      .quote-latin {
        font-family: 'Caveat', cursive;
        font-size: 22px;
        fill: #00ff66;
        text-anchor: middle;
        filter: url(#glow);
      }

      .quote-trans {
        font-family: 'Caveat', cursive;
        font-size: 18px;
        fill: #88af8c;
        text-anchor: middle;
      }

      .crt-lines {
        fill: url(#crt-pattern);
        opacity: 0.12;
      }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CRT scanlines pattern -->
    <pattern id="crt-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background console panel -->
  <rect class="bg" x="1" y="1" width="1098" height="108" rx="6" />

  <!-- Text elements centered at 550 -->
  <text x="550" y="47" class="quote-latin">"Hoc est repositorium in quo vivit chat antiquus et arcanus, nunc potentia SQL confirmatus..."</text>
  <text x="550" y="77" class="quote-trans">(This is the repository where an arcane chat dwells, now fortified by the power of SQL...)</text>

  <!-- CRT overlay scanlines -->
  <rect class="crt-lines" width="100%" height="100%" rx="6" pointer-events="none" />
</svg>
