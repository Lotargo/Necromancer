<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <!-- Import Google Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&amp;display=swap');

      .bg {
        fill: #080303;
        stroke: #ff3333;
        stroke-width: 1;
        stroke-opacity: 0.4;
      }

      .quote-latin {
        font-family: 'Caveat', cursive;
        font-size: 23px;
        fill: #ff3333;
        text-anchor: middle;
        filter: url(#glow);
      }

      .quote-trans {
        font-family: 'Caveat', cursive;
        font-size: 19px;
        fill: #af8888;
        text-anchor: middle;
      }

      .crt-lines {
        fill: url(#crt-pattern);
        opacity: 0.12;
      }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CRT scanlines pattern -->
    <pattern id="crt-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background console panel -->
  <rect class="bg" x="1" y="1" width="798" height="98" rx="6" />

  <!-- Text elements centered at 400 -->
  <text x="400" y="42" class="quote-latin">* Memento: Omnes viae Romam ducunt! *</text>
  <text x="400" y="72" class="quote-trans">(Remember: All roads lead to Rome!)</text>

  <!-- CRT overlay scanlines -->
  <rect class="crt-lines" width="100%" height="100%" rx="6" pointer-events="none" />
</svg>
