<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- CRT Screen Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Eldritch Inner Shadow Filter -->
    <filter id="inner-shadow">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#00ff00" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <style>
    .glow-path {
      fill: none;
      stroke: #00ff00;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#glow);
    }
    .neon-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      fill: #00ff00;
      filter: url(#glow);
      letter-spacing: 6px;
    }
    .occult-symbols {
      fill: none;
      stroke: #008800;
      stroke-width: 1.5;
      opacity: 0.6;
      stroke-dasharray: 4,4;
    }
    .crt-scanlines {
      fill: url(#scanline-pattern);
      opacity: 0.15;
    }
  </style>

  <!-- Dark Crypt Background -->
  <rect width="100%" height="100%" fill="#050505"/>

  <!-- Occult Cabbalistic Circle & Pentagram -->
  <circle cx="300" cy="270" r="220" class="glow-path" stroke-dasharray="10 15" style="stroke-width: 1.5; stroke: #00cc00;" />
  <circle cx="300" cy="270" r="240" class="glow-path" style="stroke-width: 3; stroke: #00ff00;" />
  
  <!-- Elder Sign Star Lines -->
  <polygon points="300,30 430,410 110,180 490,180 170,410" class="occult-symbols" />

  <!-- Runes and Occult Markings -->
  <g class="neon-text" style="font-size: 14px; opacity: 0.8;">
    <text x="300" y="55" text-anchor="middle">𐏃 𐎵 𐎪</text>
    <text x="495" y="275" text-anchor="middle">𐎠 𐎫</text>
    <text x="300" y="495" text-anchor="middle">𐎹 𐎥 𐎼</text>
    <text x="105" y="275" text-anchor="middle">𐎫 𐎵</text>
  </g>

  <!-- Glowing Cyber Skull Centerpiece -->
  <g transform="translate(180, 140)">
    <!-- Outer Skull Shape Contour -->
    <path d="M 60,30 
             C 40,30 10,70 10,120
             C 10,180 40,195 40,210
             L 55,210 L 55,240
             C 55,250 85,250 85,250
             L 155,250
             C 155,250 185,250 185,240
             L 185,210 L 200,210
             C 200,195 230,180 230,120
             C 230,70 200,30 180,30
             Z" 
          class="glow-path" style="stroke-width: 4; fill: #081a08; fill-opacity: 0.8;" />

    <!-- Skull Eye Sockets -->
    <path d="M 50,110 C 50,130 85,130 85,110 C 85,90 50,90 50,110 Z" class="glow-path" style="fill: #000; stroke-width: 3;" />
    <path d="M 155,110 C 155,130 190,130 190,110 C 190,90 155,90 155,110 Z" class="glow-path" style="fill: #000; stroke-width: 3;" />
    
    <!-- Glowing Eye Pupils (Eldritch Flame) -->
    <circle cx="67" cy="110" r="5" fill="#ff0000" filter="url(#glow)"/>
    <circle cx="172" cy="110" r="5" fill="#ff0000" filter="url(#glow)"/>

    <!-- Nasal Cavity -->
    <path d="M 110,150 L 120,135 L 130,150 L 125,160 L 115,160 Z" class="glow-path" style="fill: #000; stroke-width: 2.5;" />

    <!-- Teeth / Grille (Representing CRT Terminal Matrix lines) -->
    <path d="M 75,200 L 165,200" class="glow-path" style="stroke-width: 3;" />
    <path d="M 85,200 L 85,230" class="glow-path" style="stroke-width: 2;" />
    <path d="M 100,200 L 100,230" class="glow-path" style="stroke-width: 2;" />
    <path d="M 115,200 L 115,230" class="glow-path" style="stroke-width: 2;" />
    <path d="M 125,200 L 125,230" class="glow-path" style="stroke-width: 2;" />
    <path d="M 140,200 L 140,230" class="glow-path" style="stroke-width: 2;" />
    <path d="M 155,200 L 155,230" class="glow-path" style="stroke-width: 2;" />

    <!-- Circuit board traces inside skull (Merging occult + tech) -->
    <path d="M 120,30 L 120,80" class="occult-symbols" style="stroke-dasharray: none;" />
    <path d="M 120,80 L 95,100" class="occult-symbols" style="stroke-dasharray: none;" />
    <path d="M 120,80 L 145,100" class="occult-symbols" style="stroke-dasharray: none;" />
  </g>

  <!-- Title Text: NECROMANCER -->
  <text x="300" y="530" text-anchor="middle" class="neon-text" style="font-size: 32px;">NECROMANCER</text>
  <text x="300" y="560" text-anchor="middle" class="neon-text" style="font-size: 14px; fill: #00cc00; letter-spacing: 3px;">EX LIBRIS DAEMONIUM</text>
</svg>
